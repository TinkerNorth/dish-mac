# Dish Mac — SwiftLint configuration
# Tuned for a single-window SwiftUI gamepad controller app.

included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - Dish.app

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true
  ignores_function_declarations: true

function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 25

function_parameter_count:
  warning: 8
  error: 10

large_tuple:
  warning: 4
  error: 5

nesting:
  type_level:
    warning: 3

identifier_name:
  min_length: 2
  max_length:
    warning: 50
    error: 60
  # Single-letter names are idiomatic in bit-packing / HID report code and
  # in short-lived loop indices; wire layout constants use compact naming.
  excluded:
    - id
    - ip
    - x
    - y
    - X
    - Y
    - lx
    - ly
    - rx
    - ry
    - lt
    - rt
    - fd
    - sa
    - sfd

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

disabled_rules:
  - todo           # we tag protocol-parity TODOs deliberately
  - trailing_comma # SwiftFormat owns this
  - opening_brace  # SwiftFormat owns this

opt_in_rules:
  - empty_count
  - empty_string
  - closure_end_indentation
  - closure_spacing
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - unused_import
  - vertical_whitespace_closing_braces
  - yoda_condition

force_unwrapping:
  severity: warning

reporter: "xcode"
