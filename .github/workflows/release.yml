name: Release

on:
  push:
    # Bare MAJOR.MINOR.PATCH, no `v`: the fleet's tag shape since 2.0.0.
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

# Required secrets (optional — workflow falls back to unsigned/un-notarized
# for workflow_dispatch on feature branches; tagged releases on main are
# blocked by `required-secrets` if any are missing):
#
#   DEVELOPER_ID_APPLICATION_CERT_BASE64  base64 of the .p12 Developer ID cert
#   DEVELOPER_ID_PASSWORD                 .p12 password
#   APPLE_ID                              Apple ID email used for notarization
#   APPLE_TEAM_ID                         Apple Developer Team ID (10 chars)
#   APPLE_APP_SPECIFIC_PASSWORD           app-specific password for notarization
#
# When all are present: Dish.app is signed with hardened runtime + the secure
# timestamp, submitted to Apple's notarization service, and stapled. Otherwise
# the .app is uploaded unsigned and tagged `-unsigned` in its filename.
#
# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout                @ v6.0.2  → de0fac2e4500dabe0009e67214ff5f5447ce83dd
#   actions/cache                   @ v5.0.5  → 27d5ce7f107fe9357f9df03efb73ab90386fccae
#   actions/upload-artifact         @ v7.0.1  → 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact       @ v8.0.1  → 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   anchore/sbom-action             @ v0.24.2 → 3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
#   anchore/scan-action             @ v7.4.2  → 27805bf3b4e84b4a5c980df22ed233c00390a439
#   github/codeql-action/upload-sarif @ v4.38.0 → b96794f015dfd88f77b49b1c93e0fa7110f94c63
#   softprops/action-gh-release     @ v3.0.0  → b4309332981a82ec1c5618f44dd2e27cc8bfbfda
#   slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml
#                                   @ v2.1.0  → f7dd8c54c2067bafc12ca7a55595d5ee9b75204a

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: PR-time gates against tag
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: |
        .
      gitleaks_enabled: true
      dependency_review_enabled: false
      action_pin_lint_enabled: true
      allowlist_expiry_enabled: true

  required-secrets:
    name: Required release secrets gate
    needs: [gates]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required signing secrets are present for tagged releases
        env:
          DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::notice::Non-tag release run — unsigned fallback permitted."
            exit 0
          fi
          missing=()
          [ -z "${DEVELOPER_ID_APPLICATION_CERT_BASE64:-}" ] && missing+=("DEVELOPER_ID_APPLICATION_CERT_BASE64")
          [ -z "${DEVELOPER_ID_PASSWORD:-}" ] && missing+=("DEVELOPER_ID_PASSWORD")
          [ -z "${APPLE_ID:-}" ] && missing+=("APPLE_ID")
          [ -z "${APPLE_TEAM_ID:-}" ] && missing+=("APPLE_TEAM_ID")
          [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Tagged release on $GITHUB_REF requires Apple signing secrets, but the following are missing: ${missing[*]}"
            echo "::error::Add the missing repository secrets and retry the release. Unsigned -unsigned artifacts are NOT permitted for tags."
            exit 1
          fi

  release:
    name: Build + sign Dish.app
    needs: [gates, required-secrets]
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # VERSION is the one source of the app's version; a tag that disagrees
      # would publish an app that reports a different number than its release.
      - name: Assert the tag matches VERSION
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$tag' does not match VERSION '$version'"
            exit 1
          fi
          echo "tag $tag matches VERSION"

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build release
        run: swift build --configuration release

      - name: Bundle .app
        run: ./bundle.sh release

      - name: Import signing certificate (if present)
        id: sign
        env:
          CERT_B64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PW: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        run: |
          if [ -z "${CERT_B64}" ] || [ -z "${CERT_PW}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Developer ID cert not configured — Dish.app will be uploaded unsigned."
            exit 0
          fi
          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          echo "${CERT_B64}" | base64 -d > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" -P "${CERT_PW}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN}" "$(security list-keychains -d user | tr -d '"')"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PW}" "${KEYCHAIN}" >/dev/null
          IDENTITY=$(security find-identity -v -p codesigning "${KEYCHAIN}" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "identity=${IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "keychain=${KEYCHAIN}" >> "$GITHUB_OUTPUT"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Sign Dish.app
        if: steps.sign.outputs.present == 'true'
        run: |
          codesign --force --options runtime --timestamp \
            --sign "${{ steps.sign.outputs.identity }}" --deep Dish.app
          codesign --verify --strict --deep --verbose=2 Dish.app

      - name: Notarize
        if: steps.sign.outputs.present == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ditto -c -k --keepParent Dish.app "${RUNNER_TEMP}/Dish.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/Dish.zip" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait
          xcrun stapler staple Dish.app
          xcrun stapler validate Dish.app

      - name: Stage artifact
        id: stage
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          suffix=""
          if [ "${{ steps.sign.outputs.present }}" != "true" ]; then
            suffix="-unsigned"
          fi
          ditto -c -k --sequesterRsrc --keepParent Dish.app "dist/dish-${tag}${suffix}.zip"
          # The stable name is a permanent download URL; the website and any
          # installed copy build on it, so it never changes shape.
          cp "dist/dish-${tag}${suffix}.zip" "dist/dish-mac${suffix}.zip"
          ls -l dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: dist/

  # =========================================================================
  # latest.json, the update manifest.
  #
  # DishCore's UpdateManifest fetches releases/latest/download/latest.json and
  # rejects anything whose product is not "dish-mac", whose channel is not
  # "stable", or whose minimumSupportedVersion is malformed or newer than its
  # version. This job is the only producer; the asset name never changes.
  # Without it the in-app update check 404s forever. ReleaseManifestTests
  # pins the strings below against the code that reads them.
  #
  # Prerelease tags emit nothing: the permalink must keep serving stable
  # clients the last stable release's manifest.
  # =========================================================================
  manifest:
    name: Emit update manifest
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Write latest.json (stable tags only)
        id: emit
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          case "${version}" in
            *-*)
              echo "::notice::Prerelease tag ${TAG}: skipping latest.json so the stable permalink keeps serving the last stable release."
              echo "stable=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '${TAG}' is not MAJOR.MINOR.PATCH[-prerelease]"; exit 1 ;;
          esac

          # The drift that breaks every client at once: a manifest naming a
          # version the shipped app does not report. VERSION is what bundle.sh
          # writes into Info.plist, so checking it checks the app.
          file_version="$(tr -d '[:space:]' < VERSION)"
          [ "${file_version}" = "${version}" ] \
            || { echo "::error::tag ${TAG} but VERSION is ${file_version}"; exit 1; }

          min="$(python3 -c 'import json;print(json.load(open("packaging/update-policy.json"))["minimumSupportedVersion"])')"

          mkdir -p dist
          python3 - "$version" "$min" "$REPO" "$TAG" > dist/latest.json <<'PY'
          import json, sys, datetime
          version, minimum, repo, tag = sys.argv[1:5]
          print(json.dumps({
              "schema": 1,
              "product": "dish-mac",
              "version": version,
              "channel": "stable",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc)
                                 .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "minimumSupportedVersion": minimum,
              "releaseNotesUrl": f"https://github.com/{repo}/releases/tag/{tag}",
          }, indent=2))
          PY
          cat dist/latest.json
          echo "stable=true" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.emit.outputs.stable == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-manifest
          path: dist/latest.json
          if-no-files-found: error

  harden:
    name: Harden artifacts (scan, SBOM, sign)
    needs: [release, manifest]
    runs-on: ubuntu-24.04
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      # The app bundle and the manifest land side by side so SHA256SUMS, the
      # cosign signatures and the SLSA provenance cover latest.json too.
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos*
          merge-multiple: true
          path: release

      - name: Vulnerability scan (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          path: release/
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          add-cpes-if-none: true
          output-format: sarif

      - name: Upload Grype SARIF to code scanning
        if: ${{ always() && steps.grype.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: release-grype

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: release/
          format: spdx-json
          output-file: release/dish-mac.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: release/
          format: cyclonedx-json
          output-file: release/dish-mac.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign (upstream binary)
        shell: bash
        env:
          COSIGN_VERSION: "2.4.1"
          # Pin upstream SHA-256 of cosign-linux-amd64. Verify with:
          #   gh release view v${COSIGN_VERSION} -R sigstore/cosign --json assets
          COSIGN_SHA256: "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b" # cosign-linux-amd64 v2.4.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          if [ "${COSIGN_SHA256}" != "TODO_REPLACE_WITH_UPSTREAM_SHA256" ]; then
            echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          else
            echo "::warning::COSIGN_SHA256 is unset — replace with the upstream SHA-256 to enforce binary integrity."
          fi
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -d '\n' sha256sum --binary > SHA256SUMS
          cat SHA256SUMS

      - name: Cosign-sign each artifact + SHA256SUMS (keyless)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd release
          for f in *; do
            case "$f" in
              *.sig|*.crt|SHA256SUMS.sig|SHA256SUMS.crt) continue ;;
            esac
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.crt" \
              "$f"
          done
          ls -l

      - name: Compute base64 SHA256 hashes for SLSA provenance
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          cd release
          h=$(find . -maxdepth 1 -type f ! -name '*.sig' ! -name '*.crt' \
                  -printf '%f\n' \
                | LC_ALL=C sort \
                | xargs -d '\n' sha256sum \
                | base64 -w0)
          echo "hashes=${h}" >> "$GITHUB_OUTPUT"

      - name: Upload hardened bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release/
          retention-days: 14

  provenance:
    name: SLSA L3 provenance
    needs: [harden]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.harden.outputs.hashes }}
      provenance-name: dish-mac.intoto.jsonl
      upload-assets: false

  publish:
    name: Publish to GitHub Releases
    needs: [harden, provenance]
    runs-on: ubuntu-24.04
    steps:
      - name: Download hardened bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: release

      - name: Show what we're about to publish
        run: find release -type f -printf '%p\n'

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/**/*
