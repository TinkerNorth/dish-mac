name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

# Required secrets (optional — workflow falls back to unsigned/un-notarized):
#   DEVELOPER_ID_APPLICATION_CERT_BASE64  base64 of the .p12 Developer ID cert
#   DEVELOPER_ID_PASSWORD                 .p12 password
#   APPLE_ID                              Apple ID email used for notarization
#   APPLE_TEAM_ID                         Apple Developer Team ID (10 chars)
#   APPLE_APP_SPECIFIC_PASSWORD           app-specific password for notarization
#
# When all are present: Dish.app is signed with hardened runtime + the secure
# timestamp, submitted to Apple's notarization service, and stapled. Otherwise
# the .app is uploaded unsigned and tagged `-unsigned` in its filename.

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build release
        run: swift build --configuration release

      - name: Bundle .app
        run: ./bundle.sh release

      - name: Import signing certificate (if present)
        id: sign
        env:
          CERT_B64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PW: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        run: |
          if [ -z "${CERT_B64}" ] || [ -z "${CERT_PW}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Developer ID cert not configured — Dish.app will be uploaded unsigned."
            exit 0
          fi
          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          echo "${CERT_B64}" | base64 -d > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" -P "${CERT_PW}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN}" "$(security list-keychains -d user | tr -d '"')"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PW}" "${KEYCHAIN}" >/dev/null
          IDENTITY=$(security find-identity -v -p codesigning "${KEYCHAIN}" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "identity=${IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "keychain=${KEYCHAIN}" >> "$GITHUB_OUTPUT"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Sign Dish.app
        if: steps.sign.outputs.present == 'true'
        run: |
          codesign --force --options runtime --timestamp \
            --sign "${{ steps.sign.outputs.identity }}" --deep Dish.app
          codesign --verify --strict --deep --verbose=2 Dish.app

      - name: Notarize
        if: steps.sign.outputs.present == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ditto -c -k --keepParent Dish.app "${RUNNER_TEMP}/Dish.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/Dish.zip" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait
          xcrun stapler staple Dish.app
          xcrun stapler validate Dish.app

      - name: Stage artifact
        id: stage
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          suffix=""
          if [ "${{ steps.sign.outputs.present }}" != "true" ]; then
            suffix="-unsigned"
          fi
          ditto -c -k --sequesterRsrc --keepParent Dish.app "dist/dish-${tag}${suffix}.zip"
          ls -l dist/

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
