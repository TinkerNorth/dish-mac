name: CodeQL

# Source-level static analysis for dish-mac (Swift / SwiftUI / SwiftPM).
#
# CodeQL Swift requires macos runners. Build the package with `swift
# build` against the autobuild detector.
#
# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout         @ v6.0.2  → de0fac2e4500dabe0009e67214ff5f5447ce83dd
#   actions/cache            @ v5.0.5  → 27d5ce7f107fe9357f9df03efb73ab90386fccae
#   github/codeql-action/*   @ v4.35.5 → 9e0d7b8d25671d64c341c19c0152d693099fb5ba

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .build
          key: ${{ runner.os }}-codeql-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-codeql-spm-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build
        run: swift build --configuration release

      - name: Perform CodeQL analysis
        # SARIF upload requires GitHub Advanced Security on private repos.
        # `continue-on-error` keeps the analysis running and surfacing
        # findings in the logs while GHAS enablement is still pending —
        # see HANDOFF.md item 5.
        continue-on-error: true
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:${{ matrix.language }}"
          upload: failure-only
