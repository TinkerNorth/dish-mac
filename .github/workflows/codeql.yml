name: CodeQL

# Source-level static analysis for dish-mac (Swift / SwiftUI / SwiftPM).
#
# CodeQL Swift requires macos runners. Build the package with `swift
# build` against the autobuild detector.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # The crash reporter's unused binary slices stay out of the cache: SwiftPM
      # downloads every xcframework the sentry-cocoa package declares, three
      # gigabytes unpacked, and the build needs only `Sentry`; a missing
      # unused artifact is neither re-fetched nor missed.
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            !.build/artifacts/sentry-cocoa/Sentry-*
            !.build/artifacts/sentry-cocoa/SentryObjC-*
          key: ${{ runner.os }}-codeql-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-codeql-spm-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build
        run: swift build --configuration release

      - name: Perform CodeQL analysis
        # SARIF upload requires GitHub Advanced Security on private repos.
        # `continue-on-error` keeps the analysis running and surfacing
        # findings in the logs while GHAS enablement is still pending —
        # see HANDOFF.md item 5.
        continue-on-error: true
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
          upload: failure-only
