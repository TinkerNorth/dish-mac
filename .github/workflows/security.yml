name: Security

# PR-time security gates for dish-mac. Pulls the shared jobs from this
# repo's local copy of `_security.yml` (action-pin lint, allowlist-
# expiry, OSV-Scanner, dependency-review, gitleaks). CodeQL lives in
# codeql.yml because it has its own matrix.
#
# `dependency-review-action` is the primary advisory check for SwiftPM
# — it consumes Package.resolved on PRs and fails on high-severity
# findings against GitHub's advisory DB.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  shared:
    uses: ./.github/workflows/_security.yml
    with:
      # SwiftPM resolution lives in Package.resolved; OSV understands
      # nothing C++/Kotlin specific here, but Package.resolved itself
      # is recognised. Scan the worktree.
      osv_scan_paths: |
        .
      gitleaks_enabled: true
      dependency_review_enabled: true
      action_pin_lint_enabled: true
      allowlist_expiry_enabled: true
