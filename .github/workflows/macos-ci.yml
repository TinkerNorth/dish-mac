name: macOS CI

# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout         @ v4.2.2 → 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/cache            @ v4.1.2 → 6849a6489940f00c2f30c0fb92c6274307ccb58a
#   actions/upload-artifact  @ v4.4.3 → b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test, lint, format
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install SwiftLint + SwiftFormat
        run: brew install swiftlint swiftformat

      - name: SwiftFormat (check only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Build (debug)
        run: swift build --configuration debug

      - name: Run tests
        run: swift test --parallel --enable-code-coverage

      - name: Build release binary
        run: swift build --configuration release

      - name: Bundle .app
        run: ./bundle.sh release

      - name: Upload .app artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: Dish.app
          path: Dish.app
          retention-days: 14
