name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build, test, lint, format
    # macOS 14 images are deprecated (unsupported from 2026-11-02) and their
    # Xcode 15 SwiftPM cannot compile the String Catalog. Xcode 26.6 is the
    # macos-26 image's default today; it is selected by version below so an
    # image update cannot change the toolchain silently. Bump together with
    # CONTRIBUTING.md.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Swift version
        run: swift --version

      # The compiled resource bundles stay out of the cache: a restored
      # bundle carries the previous commit's language tables, which shadow
      # the current catalog, and nothing in the build graph removes them.
      # The crash reporter's unused binary slices stay out too: SwiftPM
      # downloads every xcframework the sentry-cocoa package declares, three
      # gigabytes unpacked, and the build needs only `Sentry`; a missing
      # unused artifact is neither re-fetched nor missed.
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            !.build/**/*.bundle
            !.build/artifacts/sentry-cocoa/Sentry-*
            !.build/artifacts/sentry-cocoa/SentryObjC-*
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/Resources/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Release binaries at pinned versions (scripts/tools.sh), not `brew
      # install`: Homebrew tracks its latest, and SwiftFormat 0.63.0 (a new
      # wrapIfStatementBodies rule) turned this check red on 2026-09-04
      # without a Swift file changing. A bump is a deliberate commit that
      # reformats alongside it.
      - name: SwiftFormat (check only) and SwiftLint
        run: scripts/check-format.sh

      - name: Build (debug, with tests) and run the tests
        run: scripts/build-and-test.sh

      # Every scenario of the bench for 0.2 s against the release build, then
      # the bundle: the same script ci-local.sh runs.
      - name: Release build, bench smoke, bundle
        run: scripts/build-app.sh

      # The release signs with the hardened runtime; ad hoc here, so the
      # signing command, the entitlement and the launch of the result are
      # exercised on every pull request. Notarisation needs the Apple secrets
      # and runs only in release.yml.
      - name: Sign with the hardened runtime (ad hoc)
        run: scripts/sign-app.sh - Dish.app

      # A user's Mac has no build tree to fall back on; the launch must not
      # need one (1.0.2 to 1.2.0 crashed at launch everywhere but CI). The
      # script also checks the bundled controller database first.
      - name: Launch the bundled app with no build tree beside it
        run: scripts/launch-smoke.sh Dish.app

      # The hardened bundle itself, in place (a runner has no preferences to
      # protect), as release.yml launches the final one.
      - name: Launch the hardened bundle as signed
        env:
          DISH_SMOKE_AS_SIGNED: "1"
        run: scripts/launch-smoke.sh Dish.app

      - name: Upload .app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dish.app
          path: Dish.app
          retention-days: 14

      # The release's own zip, named the way a tag names it (unsigned), for the
      # hardening dry run below.
      - name: Stage the release zip
        run: scripts/stage-zip.sh "$(tr -d '[:space:]' < VERSION)" false

      - name: Upload the zip for the hardening dry run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # The release's scan, SBOMs, checksums and signing, on the PR-built zip: the
  # shared workflow release.yml calls on a tag, with a throwaway key and nothing
  # published. contents: read is all it needs, so it runs on a fork's pull
  # request too.
  release-dry-run:
    name: Release hardening (dry run)
    if: ${{ github.event_name == 'pull_request' }}
    needs: [ci]
    permissions:
      contents: read
    uses: ./.github/workflows/_release_harden.yml
    with:
      artifact-pattern: macos*
      product: dish-mac
      dry-run: true

  # The LOCK_STATS build counts every tracked lock by thread role; its own
  # tests and the lock-law test run only there. A cache of its own, so
  # neither job restores the other's objects.
  lock-stats:
    name: Lock statistics build and tests
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            !.build/**/*.bundle
            !.build/artifacts/sentry-cocoa/Sentry-*
            !.build/artifacts/sentry-cocoa/SentryObjC-*
          key: ${{ runner.os }}-lockstats-spm-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/Resources/**') }}
          restore-keys: |
            ${{ runner.os }}-lockstats-spm-
            ${{ runner.os }}-spm-

      - name: Lock statistics build, tests and bench smoke
        run: scripts/lock-stats.sh
