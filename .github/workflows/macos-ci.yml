name: macOS CI

# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout         @ v6.0.2 → de0fac2e4500dabe0009e67214ff5f5447ce83dd
#   actions/cache            @ v5.0.5 → 27d5ce7f107fe9357f9df03efb73ab90386fccae
#   actions/upload-artifact  @ v7.0.1 → 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test, lint, format
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Release binaries at pinned versions, not `brew install`: Homebrew
      # tracks its latest, and SwiftFormat 0.63.0 (a new wrapIfStatementBodies
      # rule) turned this check red on 2026-09-04 without a Swift file
      # changing. These are the versions the tree is formatted and linted
      # with; a bump is a deliberate commit that reformats alongside it.
      - name: Install SwiftFormat + SwiftLint (pinned)
        env:
          SWIFTFORMAT_VERSION: 0.61.1
          SWIFTFORMAT_SHA256: b990400779aceb7d7020796eb9ba814d4480543f671d38fc0ff48cb72f04c584
          SWIFTLINT_VERSION: 0.65.0
          SWIFTLINT_SHA256: d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/swift-tools"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/swiftformat.zip"             "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  $tools/swiftformat.zip" | shasum -a 256 -c -
          unzip -q -o "$tools/swiftformat.zip" -d "$tools"
          curl -fsSL --retry 3 -o "$tools/swiftlint.zip"             "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $tools/swiftlint.zip" | shasum -a 256 -c -
          unzip -q -o "$tools/swiftlint.zip" -d "$tools"
          chmod +x "$tools/swiftformat" "$tools/swiftlint"
          echo "$tools" >> "$GITHUB_PATH"
          "$tools/swiftformat" --version
          "$tools/swiftlint" --version

      - name: SwiftFormat (check only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Build (debug)
        run: swift build --configuration debug

      - name: Run tests
        run: swift test --parallel --enable-code-coverage

      - name: Build release binary
        run: swift build --configuration release

      - name: Bundle .app
        run: ./bundle.sh release

      - name: Upload .app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Dish.app
          path: Dish.app
          retention-days: 14
